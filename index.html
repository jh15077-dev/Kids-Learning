<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Math Siege (Trebuchet vs Castle)</title>
  <style>
    :root { font-family: system-ui, Arial, sans-serif; }
    body { margin:0; background:#f6f7fb; color:#111; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 18px; }
    .card{
      background:#fff; border-radius:16px; padding:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.08);
      position:relative; overflow:hidden;
    }
    h1{ margin:0 0 6px; font-size:28px; }
    .sub{ margin:0 0 12px; opacity:.75; }


    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .pill{
      background:#eef2ff; border-radius:999px; padding:8px 12px;
      display:inline-flex; gap:8px; align-items:center;
    }
    input[type="text"]{
      border:0; border-radius:12px; padding:10px 12px;
      font-size:16px; background:#f1f5f9; width:140px;
    }
    select, button{
      border:0; border-radius:12px; padding:10px 12px; font-size:16px;
    }
    select{ background:#f1f5f9; cursor: pointer; }
    button{ background:#111; color:#fff; cursor:pointer; }
    button:disabled{ opacity:.45; cursor:not-allowed; }


    /* Battlefield */
    .battlefield{
      position:relative; height: 320px; border-radius:16px; border:2px solid #e2e8f0;
      background: 
        radial-gradient(circle at 15% 20%, #ffdfba 0%, transparent 15%),
        linear-gradient(180deg, #ff9f43 0%, #ff6b6b 40%, #54a0ff 100%);
      overflow:hidden; margin-bottom: 14px;
    }
    .ground{
      position:absolute; left:0; right:0; bottom:0; height: 78px;
      background: linear-gradient(180deg, #2ecc71, #27ae60);
      border-top: 4px solid #1e8449;
    }


    .siegeHUD{
      position:absolute; top:10px; left:10px; right:10px;
      display:flex; justify-content:space-between; gap:10px; pointer-events:none;
    }
    .hudBadge{
      background: rgba(255,255,255,.88); border:1px solid #e2e8f0;
      border-radius: 999px; padding: 6px 10px; font-size: 14px; font-weight: bold;
    }


    /* Trebuchet Redesign */
    .trebuchetArea{ position:absolute; left: 10px; bottom: 44px; width: 260px; height: 210px; display:flex; align-items:flex-end; justify-content:center; }
    .treb{ position:relative; width: 220px; height: 180px; }
    .trebBase{ position:absolute; left: 18px; right: 18px; bottom: 0; height: 26px; border-radius: 12px; background: #5d4037; border-bottom: 4px solid #3e2723; }
    .trebFrame{ position:absolute; bottom: 18px; left: 48px; width: 120px; height: 120px; border-left: 10px solid #5d4037; border-right: 10px solid #5d4037; }
    .trebPivot{ position:absolute; left: 108px; bottom: 122px; width: 12px; height: 12px; border-radius: 50%; background: #2d3436; z-index: 4; }
    .trebArm{
      position:absolute; left: 114px; bottom: 128px; width: 150px; height: 12px;
      background: #3e2723; border-radius: 10px; transform-origin: 6px 6px;
      transform: rotate(-28deg); z-index: 3;
    }
    .trebArm::after{
      content:""; position:absolute; left:-28px; top:-16px; width: 35px; height: 45px;
      border-radius: 6px; background: #2d3436; border: 2px solid #636e72; box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }
    .trebSling{ position:absolute; right: -2px; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: #636e72; border: 2px solid #2d3436; }
    .trebArm.fire{ animation: armFire 400ms cubic-bezier(.2,.9,.2,1.2) both; }
    @keyframes armFire{ 0%{ transform: rotate(-28deg); } 100%{ transform: rotate(12deg); } }


    /* Castle & Knight */
    .castleArea{ position:absolute; right: 10px; bottom: 44px; width: 360px; height: 230px; display:flex; align-items:flex-end; justify-content:center; }
    .knight { 
      position: absolute; top: -55px; left: 45%; width: 50px; height: 60px; 
      background: url('https://i.imgur.com/K6V8YlY.png') no-repeat center; /* Placeholder for your knight image */
      background-size: contain; transition: 0.2s; z-index: 10; font-size: 50px;
    }
    /* If image fails, use the emoji version as backup */
    .knight::after { content: "🛡️"; position: absolute; top: 0; left: 0; }
    .knight.scared { transform: translateY(-20px) scale(1.1); filter: brightness(1.5); }
    
    .castle{ position:relative; width: 320px; height: 210px; transform-origin: center bottom; }
    .castle.shake{ animation: castleShake 240ms ease; }
    @keyframes castleShake{ 0%, 100%{ transform: translateX(0); } 25%{ transform: translateX(-5px); } 75%{ transform: translateX(5px); } }


    /* Pieces */
    .piece{ position:absolute; border: 2px solid #7f8c8d; background: #95a5a6; border-radius: 8px; overflow:hidden; transform-origin: center center; box-shadow: inset -4px -4px 0 rgba(0,0,0,0.1); }
    .crenel{ position:absolute; left:0; right:0; top:0; height:15px; background: repeating-linear-gradient(90deg, #fff 0 12px, transparent 12px 18px); }
    .gate{ position:absolute; width: 70px; height: 90px; background: #3e2723; border-radius: 35px 35px 5px 5px; left: 125px; bottom: 0; }


    #p1{ left: 18px; bottom: 16px; width: 76px; height: 160px; }
    #p2{ right: 18px; bottom: 16px; width: 76px; height: 160px; }
    #p3{ left: 96px; bottom: 10px; width: 128px; height: 140px; }
    #p4{ left: 96px; bottom: 144px; width: 128px; height: 48px; }
    #p5{ left: 56px; bottom: 10px; width: 58px; height: 84px; }
    #p6{ right: 56px; bottom: 10px; width: 58px; height: 84px; }
    #p7{ left: 18px; bottom: 172px; width: 76px; height: 22px; }
    #p8{ right: 18px; bottom: 172px; width: 76px; height: 22px; }
    #p9{ left: 96px; bottom: 190px; width: 128px; height: 22px; }
    #p10{ left: 66px; bottom: 94px; width: 188px; height: 36px; }


    .piece.fall{ animation: pieceFall 620ms cubic-bezier(.2,.8,.2,1) both; }
    @keyframes pieceFall{
      0%{ transform: translate(0,0) rotate(0deg); opacity:1; }
      100%{ transform: translate(var(--dx, 0px), 190px) rotate(var(--dr, 14deg)); opacity:0; }
    }


    .stone{ position:absolute; width: 28px; height: 28px; border-radius: 50%; background: #636e72; border: 3px solid #111; z-index: 6; pointer-events:none; box-shadow: 2px 2px 5px rgba(0,0,0,0.4); }


    /* Game UI */
    .progress{ height:12px; background:#e2e8f0; border-radius:999px; overflow:hidden; margin: 10px 0; }
    .bar{ height:100%; width:0%; background:#2ecc71; transition: width 0.3s; }
    .big{ font-size:54px; font-weight:900; text-align: center; margin: 15px 0; }
    .choices{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
    .choice{ background:#f8fafc; border:2px solid #e2e8f0; font-size: 28px; padding: 15px; border-radius: 12px; }
    .choice:hover{ background: #eef2ff; border-color: #94a3b8; }
    .msg{ margin-top:12px; padding:12px; border-radius:12px; display:none; text-align: center; font-weight: bold; }
    .ok{ background:#ecfdf5; border:1px solid #34d399; color: #065f46; }
    .no{ background:#fff7ed; border:1px solid #fb923c; color: #9a3412; }
    .celebrate{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; opacity:0; transition: 0.2s; }
    .celebrate.show{ opacity:1; }
    .banner{ background:white; border:4px solid #111; border-radius:24px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Math Siege 🧠🏹🏰</h1>
      <div class="row">
        <span class="pill">Score: <b id="score">0</b></span>
        <span class="pill">Streak: <b id="streak">0</b></span>
        <span class="pill">Name: <input id="kidName" type="text" value="Ben" maxlength="18" /></span>
        <span class="pill">Mode:
          <select id="mode">
            <option value="kAdd">K - Addition (+)</option>
            <option value="kSub">K - Subtraction (-)</option>
            <option value="kMix">K - Add/Sub (+/-)</option>
            <option value="mult">Multiply (×)</option>
            <option value="div">Divide (÷)</option>
            <option value="multDiv" selected>Mixed Div/Mult</option>
          </select>
        </span>
        <button id="newBtn">Start Battle</button>
      </div>


      <div class="battlefield" id="battlefield">
        <div class="siegeHUD">
          <div class="hudBadge">Hits: <b id="hits">0</b>/10</div>
          <div class="hudBadge" id="castleStatus">Castle: Standing</div>
        </div>
        <div class="trebuchetArea">
          <div class="treb">
            <div class="trebBase"></div>
            <div class="trebFrame"></div>
            <div class="trebPivot"></div>
            <div class="trebArm" id="trebArm"><div class="trebSling" id="sling"></div></div>
          </div>
        </div>
        <div class="castleArea">
          <div class="knight" id="knight"></div>
          <div class="castle" id="castle">
            <div class="piece" id="p1"><div class="crenel"></div></div>
            <div class="piece" id="p2"><div class="crenel"></div></div>
            <div class="piece" id="p3"><div class="gate"></div></div>
            <div class="piece" id="p4"><div class="crenel"></div></div>
            <div class="piece" id="p5"></div><div class="piece" id="p6"></div>
            <div class="piece" id="p7"></div><div class="piece" id="p8"></div>
            <div class="piece" id="p9"></div><div class="piece" id="p10"></div>
          </div>
        </div>
        <div class="ground"></div>
      </div>


      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="big" id="q">Ready?</div>
      <div class="choices" id="choices"></div>
      <div class="msg ok" id="okMsg"></div>
      <div class="msg no" id="noMsg"></div>


      <div class="footer" style="margin-top: 15px; display: flex; gap: 10px;">
        <button id="skipBtn" style="background:#334155;">Skip</button>
        <button id="resetBtn" style="background:#b91c1c;">Reset Siege</button>
      </div>


      <div class="celebrate" id="celebrate">
        <div class="banner">
          <div id="cheerText" style="font-size: 32px; font-weight: 900;">Victory!</div>
          <div id="cheerSub">The Fortress has Fallen! 💥</div>
        </div>
      </div>
    </div>
  </div>


<script>
  const scoreEl = document.getElementById("score"), streakEl = document.getElementById("streak");
  const qEl = document.getElementById("q"), choicesEl = document.getElementById("choices"), barEl = document.getElementById("bar");
  const okMsg = document.getElementById("okMsg"), noMsg = document.getElementById("noMsg");
  const trebArmEl = document.getElementById("trebArm"), castleEl = document.getElementById("castle"), knightEl = document.getElementById("knight");
  const hitsEl = document.getElementById("hits");


  let score = 0, streak = 0, hits = 0, lock = false, current = null;
  const HITS_TO_WIN = 10;
  let destroyed = new Set();
  const pieceOrder = ["p7","p8","p9","p10","p5","p6","p4","p1","p2","p3"];


  function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }


  function makeQuestion(){
    okMsg.style.display="none"; noMsg.style.display="none"; lock = false;
    let mode = document.getElementById("mode").value;
    
    if(mode === "kMix") mode = Math.random() > 0.5 ? "kAdd" : "kSub";
    if(mode === "multDiv") mode = Math.random() > 0.5 ? "mult" : "div";


    let a, b, ans, opText;
    if(mode === "kAdd"){
      a = randInt(0, 5); b = randInt(0, 5); ans = a + b; opText = "+";
    } else if(mode === "kSub"){
      a = randInt(1, 10); b = randInt(0, a); ans = a - b; opText = "-";
    } else if(mode === "mult"){
      a = randInt(2, 10); b = randInt(2, 10); ans = a * b; opText = "×";
    } else {
      b = randInt(2, 10); ans = randInt(1, 10); a = b * ans; opText = "÷";
    }


    current = { answer: ans };
    qEl.textContent = `${a} ${opText} ${b} = ?`;
    renderChoices(ans);
  }


  function renderChoices(correct){
    choicesEl.innerHTML = "";
    const options = new Set([correct]);
    while(options.size < 4){
      let fake = correct + randInt(-5, 5);
      if(fake >= 0 && fake !== correct) options.add(fake);
    }
    [...options].sort(()=>Math.random()-0.5).forEach(val => {
      const btn = document.createElement("button");
      btn.className = "choice"; btn.textContent = val;
      btn.onclick = () => submit(val);
      choicesEl.appendChild(btn);
    });
  }


  async function submit(val){
    if(lock) return; lock = true;
    if(val === current.answer){
      score+=10; streak++; hits++;
      scoreEl.textContent = score; streakEl.textContent = streak; hitsEl.textContent = hits;
      barEl.style.width = Math.min(100, (streak/10)*100) + "%";
      okMsg.textContent = "Correct! Firing..."; okMsg.style.display="block";
      await fireStone();
      if(hits === HITS_TO_WIN) collapseCastle();
      setTimeout(makeQuestion, 500);
    } else {
      streak = 0; barEl.style.width = "0%";
      noMsg.textContent = `Incorrect! Answer: ${current.answer}`; noMsg.style.display="block";
      lock = false;
    }
  }


  function fireStone(){
    return new Promise(res => {
      trebArmEl.classList.remove("fire"); void trebArmEl.offsetWidth;
      trebArmEl.classList.add("fire");
      const stone = document.createElement("div");
      stone.className = "stone"; stone.style.left = "130px"; stone.style.bottom = "150px";
      document.getElementById("battlefield").appendChild(stone);


      stone.animate([
        { left: '130px', bottom: '150px' },
        { left: '450px', bottom: '330px' },
        { left: '780px', bottom: '130px' }
      ], { duration: 600, easing: 'ease-out' }).onfinish = () => {
        stone.remove();
        knightEl.classList.add("scared");
        setTimeout(()=>knightEl.classList.remove("scared"), 400);
        knockPiece(); res();
      };
    });
  }


  function knockPiece(){
    const id = pieceOrder.find(p => !destroyed.has(p));
    if(id){
      destroyed.add(id);
      const el = document.getElementById(id);
      el.style.setProperty("--dx", randInt(-40, 40)+"px");
      el.style.setProperty("--dr", randInt(-20, 20)+"deg");
      el.classList.add("fall");
      document.getElementById("battlefield").classList.add("shake");
      setTimeout(()=>document.getElementById("battlefield").classList.remove("shake"), 300);
    }
  }


  function collapseCastle(){
    document.getElementById("celebrate").classList.add("show");
    document.getElementById("castleStatus").textContent = "Fortress Down!";
    const remaining = pieceOrder.filter(p => !destroyed.has(p));
    remaining.forEach((id, i) => setTimeout(()=>knockPiece(), i*100));
    setTimeout(()=>document.getElementById("celebrate").classList.remove("show"), 2500);
  }


  function resetSiege(){
    destroyed.clear(); hits = 0; hitsEl.textContent = 0; score = 0; streak = 0;
    scoreEl.textContent = 0; streakEl.textContent = 0; barEl.style.width = "0%";
    document.querySelectorAll(".piece").forEach(p => p.classList.remove("fall"));
    document.getElementById("castleStatus").textContent = "Castle: Standing";
    makeQuestion();
  }


  document.getElementById("newBtn").onclick = makeQuestion;
  document.getElementById("skipBtn").onclick = makeQuestion;
  document.getElementById("resetBtn").onclick = resetSiege;
  makeQuestion();
</script>
</body>
</html>
